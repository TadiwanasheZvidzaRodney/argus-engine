name: argus-engine

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  neo4j:
    image: neo4j:5.26-community
    container_name: argus-neo4j
    environment:
      NEO4J_AUTH: neo4j/argus-local-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  localstack:
    image: localstack/localstack:4.0
    container_name: argus-localstack
    environment:
      SERVICES: sts,sqs,sns,events,s3,kms,iam,cloudformation,cloudwatch,logs
      DEBUG: "0"
      PERSISTENCE: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/10-init-aws.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: argus-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/local/keycloak/argus-realm.json:/opt/keycloak/data/import/argus-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 30
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: argus-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging

  # Observability is opt-in: `docker compose --profile observability up -d`
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: argus-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: argus-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/local/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4319:4318"
    depends_on:
      - jaeger
    logging: *default-logging

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  localstack-data:
