[project]
name = "argus-ws"
version = "0.1.0"
description = "Argus Engine WebSocket delta gateway."
requires-python = ">=3.12"
dependencies = [
  "argus-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "redis>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_ws"]
