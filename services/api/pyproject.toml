[project]
name = "argus-api"
version = "0.1.0"
description = "Argus Engine read/admin HTTP API."
requires-python = ">=3.12"
dependencies = [
  "argus-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_api"]
