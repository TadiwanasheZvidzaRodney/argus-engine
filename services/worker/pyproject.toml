[project]
name = "argus-worker"
version = "0.1.0"
description = "Argus Engine discovery, event, and action workers."
requires-python = ">=3.12"
dependencies = [
  "argus-core",
  "redis>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_worker"]
