[project]
name = "argus-engine"
version = "0.1.0"
description = "Argus Engine monorepo — virtual root, not deployable."
requires-python = ">=3.12"
dependencies = [
  "argus-core",
  "argus-api",
  "argus-ws",
  "argus-worker",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx2>=0.1",
  "ruff>=0.7",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python/*", "services/*"]

[tool.uv.sources]
argus-core = { workspace = true }
argus-api = { workspace = true }
argus-ws = { workspace = true }
argus-worker = { workspace = true }

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "T20", "PT",
]
ignore = [
  "S101",     # asserts are expected in tests
  "B008",     # FastAPI Depends() in defaults is idiomatic
  "RUF012",   # mutable class attrs in pydantic models
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "PT011", "T20"]
"**/migrations/**" = ["E501"]
"**/scripts/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = [
  "packages/python/argus-core/src",
  "services/api/src",
  "services/ws/src",
  "services/worker/src",
]
packages = ["argus_core", "argus_api", "argus_ws", "argus_worker"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false
warn_return_any = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = [
  "packages/python/argus-core/tests",
  "services/api/tests",
  "services/ws/tests",
  "services/worker/tests",
]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:botocore.*",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["argus_core", "argus_api", "argus_ws", "argus_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
